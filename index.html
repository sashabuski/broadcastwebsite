
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASHA.FM — Downloads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="download-container">

    <div class="logo">
            <img src="logo.svg" alt="SASHA.FM Mascot" style="width: 200px;">
        </div>


<div class="radio-player">

   <!-- <div class="station-name">SASHA RADIO</div>-->
    

    <div class="live-status" id="live-status">
        <span class="live-dot" id="live-dot"></span>
        <span id="live-text">OFFLINE</span>
    </div>

    <button class="power-button" id="power-button" aria-label="Connect to radio">
        <svg class="power-icon" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2V12" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"/>
    <path d="M6.35 5.65A9 9 0 1 0 17.65 5.65"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round"/>
</svg>
    </button>

<canvas id="equaliser" width="220" height="50"></canvas>

    <div class="volume-control">
        <span class="volume-icon">−</span>
        <input
            type="range"
            id="volume-slider"
            min="0"
            max="100"
            value="70"
        >
        <span class="volume-icon">+</span>
    </div>

    <p id="player-status">RADIO OFFLINE</p>

</div>


        <div class="download-form">

            <input
                type="password"
                id="password"
                placeholder=""
                autocomplete="off"
            >

            <button id="download-button">
                DOWNLOAD (x64)
            </button>

            <p id="status"></p>

        </div>

    </main>

        <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
