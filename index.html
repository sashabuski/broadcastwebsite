
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASHA.FM — Downloads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="download-container">

        <div class="logo">
            <img src="chosenMascot.png" alt="SASHA.FM Mascot" style="width: 200px;">
        </div>

        <div class="download-form">

            <input
                type="password"
                id="password"
                placeholder=""
                autocomplete="off"
            >

            <button id="download-button">
                DOWNLOAD
            </button>

            <p id="status"></p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
